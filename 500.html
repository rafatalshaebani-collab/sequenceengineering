<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Error (500) | Sequence Engineering Australia</title>
<meta name="description" content="A temporary server error occurred. Please try again shortly.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://sequenceengineering.com.au/500.html">
<link rel="icon" type="image/png" href="/favicon.png?v=20260821" sizes="128x128"><link rel="shortcut icon" href="/favicon.ico?v=20260821">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e11;--ink-soft:#5b5b61;--paper:#f4f3f2;--red:#e2120a;--red-deep:#b00f0a;--mist:#a7a7ac;--display:'Archivo',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--bg);color:var(--mist);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
main{max-width:520px;text-align:center}
.code{font-family:var(--display);font-weight:800;font-size:clamp(64px,14vw,120px);color:#fff;letter-spacing:-.03em;line-height:1}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,30px);color:#fff;margin:12px 0 14px}
p{max-width:46ch;margin:0 auto 30px}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--body);font-size:14px;font-weight:600;padding:14px 24px;border-radius:2px;display:inline-block;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
.btn--primary{background:var(--red);color:#fff}
.btn--primary:hover{background:var(--red-deep)}
.btn--ghost{border:1px solid #2a2a2f;color:#fff}
.btn--ghost:hover{border-color:var(--red);color:#ff3b30}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">500</p>
<h1>Something went wrong on our end</h1>
<p>We hit an unexpected server error. Please try again shortly, or get in touch if the problem continues.</p>
<nav class="actions" aria-label="Suggested pages">
<a class="btn btn--primary" href="/">Back to homepage</a>
<a class="btn btn--ghost" href="/contact">Contact us</a>
</nav>
</main>
</body>
</html>
